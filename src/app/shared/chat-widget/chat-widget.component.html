<div class="chat-widget">
  @if (showHint() && !isOpen()) {
    <div class="chat-widget__hint">
      <button type="button" class="chat-widget__hint-close" (click)="dismissHint()" aria-label="Dismiss">&times;</button>
      <span>👋 Have a question about my work? Ask my AI assistant anything!</span>
    </div>
  }

  @if (isOpen()) {
    <div class="chat-widget__panel">
      <div class="chat-widget__header">
        <span>Ask about Shrehari</span>
        <button type="button" class="chat-widget__close" (click)="close()" aria-label="Close chat">&times;</button>
      </div>

      <div class="chat-widget__messages">
        @for (message of messages(); track $index) {
          <div class="chat-widget__message" [class.chat-widget__message--user]="message.role === 'user'">
            {{ message.text }}
          </div>
        }
        @if (isLoading()) {
          <div class="chat-widget__message chat-widget__message--loading">Thinking&hellip;</div>
        }
        <div #scrollAnchor></div>
      </div>

      <form class="chat-widget__input-row" (ngSubmit)="send()">
        <input
          type="text"
          placeholder="Ask a question..."
          [ngModel]="draft()"
          (ngModelChange)="draft.set($event)"
          name="chatDraft"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="isLoading()"
          maxlength="500"
        />
        <button type="submit" [disabled]="isLoading()" aria-label="Send">&#10148;</button>
      </form>
    </div>
  }

  <button
    type="button"
    class="chat-widget__toggle"
    [class.chat-widget__toggle--pulse]="!isOpen()"
    (click)="toggleOpen()"
    [attr.aria-expanded]="isOpen()"
    aria-label="Toggle chat assistant"
  >
    @if (isOpen()) {
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
    }
  </button>
</div>
